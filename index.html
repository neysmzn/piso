<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de gestión de estados</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="panel-header">
        <div>
          <h1>Panel de gestión de estados</h1>
          <p>Registra y consulta las actualizaciones de estado de tus productos.</p>
        </div>
      </header>

      <section class="card">
        <h2>Nueva actualización</h2>
        <form id="status-form" class="status-form">
          <div class="field-grid">
            <label>
              Producto
              <input id="product-name" name="productName" type="text" placeholder="Ej. Piso A-302" required />
            </label>
            <label>
              Estado
              <input id="product-status" name="status" type="text" placeholder="Ej. En revisión" required />
            </label>
            <label>
              Usuario
              <input id="author-name" name="authorName" type="text" placeholder="Ej. Marta López" required />
            </label>
          </div>

          <label>
            Comentario (opcional)
            <textarea id="status-note" name="note" rows="3" placeholder="Detalle adicional de la actualización"></textarea>
          </label>

          <label>
            Adjuntar imágenes
            <input id="status-images" name="images" type="file" accept="image/*" multiple />
          </label>

          <button type="submit">Guardar actualización</button>
        </form>
      </section>

      <section class="card">
        <div class="updates-header">
          <h2>Historial de actualizaciones</h2>
          <button id="clear-updates" class="danger" type="button">Limpiar historial</button>
        </div>
        <div id="empty-state" class="empty-state">Aún no hay actualizaciones guardadas.</div>
        <ul id="updates-list" class="updates-list" aria-live="polite"></ul>
      </section>
    </main>

    <template id="update-item-template">
      <li class="update-item">
        <div class="update-head">
          <strong class="product"></strong>
          <span class="status"></span>
        </div>
        <p class="meta"></p>
        <p class="note"></p>
        <div class="gallery"></div>
      </li>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
